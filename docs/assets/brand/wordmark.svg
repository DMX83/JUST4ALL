<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 100" width="706" height="100" role="img" aria-label="Just4Folders">
  <!--
    Logotipo Just4Folders, sin la marca. Tipografia del sistema en negrita (SF Pro Display / Helvetica
    Neue), sin cursiva ni versalitas: la misma voz que la interfaz.

    Medidas sobre una reticula de 706 x 100 (altura de mayuscula = 100):
      - Cuerpo 130, peso 700, interletra -3,5.
      - La tinta ocupa aproximadamente (10,3)-(699,100); el viewBox deja un margen minimo.
    Tinta: currentColor, para que funcione sobre claro y sobre oscuro.
    El logotipo nunca se deforma: si hay que reducirlo, se reduce entero.
  -->
  <text x="-1" y="97" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="130" font-weight="700" letter-spacing="-3.5" fill="currentColor">Just4Folders</text>
</svg>
