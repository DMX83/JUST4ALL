<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="JUST4BUTLER">
  <!-- JUST4BUTLER. Glifo: una pajarita (el mayordomo). Dos alas en «<» y «>» de trazo 72 con las
       esquinas bien marcadas, y el nudo relleno en el centro. Placa 824 en (100,100) r185.
       Acento: cian de mayordomo #06B6D4 -> #67E8F9. -->
  <defs>
    <linearGradient id="placa" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="924" y2="924">
      <stop offset="0" stop-color="#161B26"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="tinta" gradientUnits="userSpaceOnUse" x1="300" y1="330" x2="724" y2="694">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#placa)"/>
  <g fill="none" stroke="url(#tinta)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ala izquierda. -->
    <path d="M 300 336 L 480 512 L 300 688"/>
    <!-- Ala derecha. -->
    <path d="M 724 336 L 544 512 L 724 688"/>
  </g>
  <!-- El nudo, relleno: es lo que hace que se lea como una pajarita y no como dos «<». -->
  <circle cx="512" cy="512" r="58" fill="url(#tinta)"/>
</svg>
