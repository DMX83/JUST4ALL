  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#placa)"/>
  <g fill="none" stroke="url(#tinta)" stroke-width="64" stroke-linecap="round">
    <path d="M 359.6 424 A 176 176 0 0 1 664.4 424"/>
    <path d="M 664.4 600 A 176 176 0 0 1 359.6 600"/>
  </g>
  <path fill="url(#tinta)" d="M 692.4 472.5 L 621.6 441.8 L 701.2 395.8 z"/>
