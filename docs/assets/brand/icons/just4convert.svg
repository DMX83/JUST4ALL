<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="JUST4CONVERT">
  <!-- JUST4CONVERT. Glifo: dos flechas girando (conversion). Placa 824 en (100,100) r185.
       Circunferencia r176 en (512,512); dos arcos de 120 grados y dos puntas macizas. Trazo 64.
       Acento: verde #2EAB78 -> #66D3A4. -->
  <defs>
