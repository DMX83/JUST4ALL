<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="JUST4DESK">
  <!-- JUST4DESK. Glifo: pantalla con lupa (el buscador que ordena). Placa 824 en (100,100) r185.
       Pantalla 512x336 en (256,288) r52, lupa r80 en (466,442) con mango, pie y base macizos.
       Trazo 64 en todo lo dibujado a linea. Acento: indigo #5E5CE6 -> #8F8EF5. -->
  <defs>
    <linearGradient id="placa" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="924" y2="924">
      <stop offset="0" stop-color="#161B26"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="tinta" gradientUnits="userSpaceOnUse" x1="256" y1="288" x2="768" y2="752">
      <stop offset="0" stop-color="#8F8EF5"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#placa)"/>
  <g fill="none" stroke="url(#tinta)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <rect x="256" y="288" width="512" height="336" rx="52"/>
    <circle cx="466" cy="442" r="80"/>
    <path d="M 524 500 L 578 554"/>
  </g>
  <rect x="470" y="624" width="84" height="76" fill="url(#tinta)"/>
  <rect x="400" y="700" width="224" height="52" rx="26" fill="url(#tinta)"/>
</svg>
