<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 173" width="706" height="173" role="img" aria-label="Just4Folders, tu Mac ordenado">
  <!--
    Variante del logotipo con el lema. La reticula es la misma de wordmark.svg (706 de ancho,
    altura de mayuscula 100) y el lema cuelga debajo, centrado:
      - Lema «tu Mac, ordenado»: cuerpo 40, peso 500, interletra 6.
      - Hueco entre la tinta del logotipo y la del lema: 34.
      - El lema va en tono secundario: se aplica con opacidad 0,62 sobre la misma tinta.
    Se usa cuando hay sitio de sobra (pagina, DMG, ficha de la app). En la barra del sitio, no.
  -->
  <g fill="currentColor">
    <text x="-1" y="97" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="130" font-weight="700" letter-spacing="-3.5">Just4Folders</text>
    <text x="153" y="164" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" letter-spacing="6" opacity="0.62">tu Mac, ordenado</text>
  </g>
</svg>
