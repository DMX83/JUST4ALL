name: JUST4ALL
options:
  bundleIdPrefix: com.dmx83
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 0.1.0
    PRODUCT_BUNDLE_IDENTIFIER: com.dmx83.just4all
    INFOPLIST_KEY_CFBundleDisplayName: JUST4ALL
    INFOPLIST_KEY_LSMinimumSystemVersion: 13.0
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_VERSION: 5.9

targets:
  JUST4ALL:
    type: application
    platform: macOS
    sources:
      - path: Sources/JUST4ALL
      - path: Sources/JUST4ALL/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: JUST4ALL
        PRODUCT_BUNDLE_IDENTIFIER: com.dmx83.just4all
        INFOPLIST_KEY_CFBundleExecutable: JUST4ALL
        INFOPLIST_KEY_CFBundleName: JUST4ALL
        INFOPLIST_KEY_CFBundlePackageType: APPL
    dependencies: []
